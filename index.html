<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calendario SMM · Luvania y CIFES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --titulo: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
    --texto: "Mulish", Avenir, "Avenir Next", -apple-system, sans-serif;
    --tinta: #2a2320;
    --suave: #9a8b80;
    --tenue: #c4b5a8;
    --linea: #e6dbd0;
    --coral: #c96f4a;
    --amarillo: #e8b53d;
    --amarillo-suave: #fdf6dd;
    --crema: #faf5ef;
    --fondo: #efe8df;
    --papel: #ffffff;
    --luvania: #c96f4a;
    --cifes: #5273b8;
    --escuela: #7a9e5c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--texto);
    background: var(--fondo); color: var(--tinta);
    margin: 0; padding: 34px 30px 70px;
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  header {
    margin-bottom: 26px; padding-bottom: 18px;
    border-bottom: 1px solid var(--tenue);
  }
  h1 {
    font-family: var(--titulo); font-size: 36px; font-weight: 500;
    margin: 0 0 6px; letter-spacing: -.4px; line-height: 1;
  }
  .sub {
    color: var(--suave); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2.2px;
  }
  .columnas { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }

  aside { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .panel {
    background: var(--papel); border-radius: 6px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(42,35,32,.07), 0 0 0 1px rgba(42,35,32,.04);
  }
  .panel h2 {
    margin: 0; padding: 13px 16px; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 2.4px;
    border-bottom: 1px solid var(--linea); background: var(--crema);
    color: var(--suave);
  }
  .panel .cuerpo { padding: 12px 14px; }
  .cabecera { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .controles { display: flex; gap: 8px; align-items: center; }

  /* lo de hoy: es lo primero que se mira */
  .hoy-panel { box-shadow: 0 0 0 3px var(--amarillo), 0 6px 22px rgba(232,181,61,.26); }
  .hoy-panel h2 { background: var(--amarillo); color: var(--tinta);
                  border-bottom-color: var(--amarillo); letter-spacing: 3px; }
  .hoy-fecha {
    font-size: 10px; color: var(--suave); margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: 1.6px; font-weight: 600;
  }
  .tarea-hoy {
    padding: 9px 0; border-bottom: 1.5px solid var(--linea);
  }
  .tarea-hoy:last-child { border-bottom: none; padding-bottom: 0; }
  .tarea-hoy .t-nom {
    font-family: var(--titulo); font-weight: 500; display: block;
    font-size: 16px; line-height: 1.3; margin: 3px 0 4px;
  }
  .tarea-hoy .t-meta { font-size: 11px; color: var(--suave); letter-spacing: .2px; }
  .nada-hoy { color: var(--suave); font-style: italic; font-size: 14px; }

  /* el detalle del dia que se abre al hacer clic en el calendario */
  .celda:not(.fuera) { cursor: pointer; }
  .celda.elegida { box-shadow: 0 0 0 2px var(--tinta), 0 8px 22px rgba(42,35,32,.16); }
  .dia-panel h2 { display: flex; justify-content: space-between; align-items: center; }
  .cerrar {
    border: none; background: none; font-size: 20px; line-height: 1;
    color: var(--suave); cursor: pointer; padding: 0 2px; width: auto;
  }
  .cerrar:hover { color: var(--tinta); background: none; }
  .det-pieza { padding: 13px 0; border-bottom: 1px solid var(--linea); }
  .det-pieza:last-child { border-bottom: none; padding-bottom: 2px; }
  .det-pieza .d-nom {
    font-family: var(--titulo); font-weight: 500; font-size: 17px;
    display: block; margin: 6px 0 5px; line-height: 1.28;
  }
  .det-pieza .d-desc { font-size: 12.5px; color: #6b5d54; margin: 8px 0; line-height: 1.6; }
  .det-fila { font-size: 11px; color: var(--suave); margin-top: 5px; }
  .det-fila b {
    color: var(--tinta); font-weight: 700; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .cuenta { font-size: 12px; color: var(--suave); }

  @media (max-width: 900px) {
    .columnas { grid-template-columns: 1fr; }
    aside { position: static; }
  }
  select, button {
    font-family: var(--texto); font-size: 12.5px; padding: 6px 11px;
    border: 1px solid var(--linea); background: #fff; color: var(--tinta);
    cursor: pointer; border-radius: 4px;
  }
  button:hover { background: var(--crema); border-color: var(--tenue); }
  .cuenta { margin-left: auto; font-size: 13px; color: var(--suave); }

  .mes-titulo {
    font-family: var(--titulo); font-size: 30px; margin: 0; font-weight: 400;
    letter-spacing: -.2px; display: flex; align-items: baseline; gap: 11px;
    text-transform: lowercase;
  }
  .mes-titulo span { color: var(--tenue); font-size: 22px; font-weight: 400; }
  .mes-sub {
    font-size: 9.5px; color: var(--suave); margin: 4px 0 22px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.8px;
  }

  .grilla { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .dia-nom {
    padding: 0 0 11px; text-align: center;
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 2.4px;
    color: var(--tenue); font-weight: 700;
  }
  .celda {
    background: var(--papel); min-height: 128px; padding: 10px 9px 12px;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(42,35,32,.06), 0 0 0 1px rgba(42,35,32,.04);
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .celda:hover {
    box-shadow: 0 6px 18px rgba(42,35,32,.11), 0 0 0 1px rgba(42,35,32,.06);
    transform: translateY(-2px);
  }
  .celda.fuera { background: transparent; box-shadow: none; }
  .celda.fuera:hover { transform: none; box-shadow: none; }
  .celda.finde { background: #f8f3ed; box-shadow: 0 0 0 1px rgba(42,35,32,.04); }
  .celda.hoy {
    background: var(--amarillo-suave);
    box-shadow: 0 0 0 3px var(--amarillo), 0 8px 24px rgba(232,181,61,.32);
  }
  .num {
    font-family: var(--titulo); font-size: 17px; color: var(--suave);
    margin-bottom: 10px; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .celda.fuera .num { color: var(--tenue); }
  .celda.hoy .num {
    color: var(--tinta); background: var(--amarillo); font-weight: 600;
    width: 28px; height: 28px; line-height: 28px; text-align: center;
    border-radius: 50%; margin: -4px 0 10px;
  }

  .pieza {
    display: block; font-size: 10.5px; line-height: 1.4;
    padding: 6px 8px; margin-bottom: 5px; border-radius: 4px;
    border-left: 2.5px solid; cursor: default;
    transition: transform .12s ease;
  }
  .pieza:hover { transform: translateX(2px); }
  .pieza b {
    display: block; font-weight: 600; margin-bottom: 3px;
    font-size: 11px; letter-spacing: -.05px; line-height: 1.35;
  }
  .pieza i {
    font-style: normal; color: var(--suave); font-size: 8.5px;
    font-weight: 700; letter-spacing: .8px;
  }
  .p-Luvania { border-color: var(--luvania); background: #fbf0ea; }
  .p-CIFES   { border-color: var(--cifes);   background: #edf1f9; }
  .p-Escuela { border-color: var(--escuela); background: #f0f5eb; }

  .leyenda {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--tenue);
    font-size: 9.5px; font-weight: 600; color: var(--suave);
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .punto { display: inline-flex; align-items: center; gap: 7px; }
  .punto i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .cargando, .vacio { padding: 40px 0; color: var(--suave); font-style: italic; }
  footer {
    margin-top: 40px; padding-top: 14px; border-top: 1.5px solid var(--linea);
    font-size: 12px; color: var(--suave);
  }
  @media (max-width: 700px) {
    body { padding: 16px 12px 40px; font-size: 14px; }
    .col-det, .col-est { display: none; }
  }
  /* la fila de hoy tambien se marca dentro de la tabla */
  tr.fila-hoy td { background: #fdf0e6; border-bottom-color: var(--coral); }
  tr.fila-hoy .nom { color: var(--coral); }
</style>
</head>
<body>

<header>
  <div class="cabecera">
    <div>
      <h1>Calendario SMM</h1>
      <div class="sub">Luvania · CIFES Centro Estético · CIFES Escuela</div>
    </div>
    <div class="controles">
      <select id="mes"></select>
      <select id="marca">
        <option value="">Todas las marcas</option>
        <option>Luvania</option>
        <option>CIFES</option>
        <option>Escuela</option>
      </select>
      <button id="recargar">Actualizar</button>
    </div>
  </div>
</header>

<div class="columnas">
  <main id="tabla"><p class="cargando">Leyendo el SMM…</p></main>

  <aside>
    <section class="panel hoy-panel">
      <h2>Hoy</h2>
      <div class="cuerpo">
        <div class="hoy-fecha" id="hoy-fecha"></div>
        <div id="hoy-lista"><span class="nada-hoy">Cargando…</span></div>
      </div>
    </section>

    <section class="panel dia-panel" id="dia-panel" hidden>
      <h2>
        <span id="dia-titulo"></span>
        <button class="cerrar" id="cerrar-dia" title="Cerrar">×</button>
      </h2>
      <div class="cuerpo" id="dia-cuerpo"></div>
    </section>
  </aside>
</div>

<footer>
  Se lee directo de las hojas SMM en Drive: lo que se escribe allá aparece aquí al
  actualizar. Sin copias intermedias.
  <span id="sello"></span>
</footer>

<script>
// Cada mes es una hoja distinta en Drive. Se agregan nuevos meses aqui.
const HOJAS = {
  "2026-09": "1yiDQ0QRSdYWipYnBf5eJsJNsVSPq01AmLhtIde1e0uw",
  "2026-10": "1K7HHBgnD1aQJ2neGa3xXJgTVAN4TEUO0BQ_eD56MP8I",
  "2026-11": "1NlZOIWBErAb73h8eJ4YrTmMQHlfoSrzK4MtlbdpENu0",
  "2026-12": "18tjIL4ohe8JjQKUG3pHXEILwTXIxob6dsCCZ782L3Tc"
};
const PESTANAS = [
  ["Luvania", "Seguimiento Luvania"],
  ["CIFES", "Seguimiento CIFES Centro estético"],
  ["Escuela", "Seguimiento CIFES Escuela"]
];
const MES_NOMBRE = {
  "01":"enero","02":"febrero","03":"marzo","04":"abril","05":"mayo","06":"junio",
  "07":"julio","08":"agosto","09":"septiembre","10":"octubre","11":"noviembre","12":"diciembre"
};

// El CSV de Google trae comillas y saltos de linea dentro de las celdas.
function partirCSV(texto) {
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"' && texto[i+1] === '"') { celda += '"'; i++; }
      else if (c === '"') comillas = false;
      else celda += c;
    } else if (c === '"') comillas = true;
    else if (c === ",") { fila.push(celda); celda = ""; }
    else if (c === "\n") { fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}

// Las fechas vienen como 4/9/2026, a veces con hora
function aISO(s) {
  if (!s) return "";
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}

async function traerPestana(id, pestana, marca) {
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(pestana)}&_=${Date.now()}`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const filas = partirCSV(await r.text());
  if (!filas.length) return [];
  const cab = filas[0].map(c => c.trim());
  const col = n => cab.findIndex(c => c.toLowerCase() === n.toLowerCase());
  const iCod = col("ID contenido"), iNom = col("Nombre contenido");
  const iRed = col("RRSS"), iFor = col("Formato"), iDet = col("Detalles");
  const iPub = col("Fecha de publicación"), iLim = col("Fecha límite");
  const iEst = col("Estado producción"), iTipo = col("Tipo contenido");
  return filas.slice(1).map(f => ({
    marca,
    codigo: (f[iCod] || "").trim(),
    nombre: (f[iNom] || "").trim(),
    red: (f[iRed] || "").trim(),
    formato: (f[iFor] || "").trim(),
    detalle: (f[iDet] || "").trim(),
    tipo: (f[iTipo] || "").trim(),
    estado: (f[iEst] || "").trim(),
    publica: aISO(f[iPub]),
    limite: aISO(f[iLim])
  })).filter(x => x.nombre);
}

async function cargar() {
  const mes = document.getElementById("mes").value;
  const filtro = document.getElementById("marca").value;
  const caja = document.getElementById("tabla");
  caja.innerHTML = '<p class="cargando">Leyendo el SMM…</p>';
  const id = HOJAS[mes];
  let todo = [];
  try {
    const partes = await Promise.all(
      PESTANAS.map(([m, p]) => traerPestana(id, p, m).catch(() => []))
    );
    todo = partes.flat();
  } catch (e) {
    caja.innerHTML = '<p class="vacio">No se pudo leer la hoja. Revisa que siga compartida.</p>';
    return;
  }
  if (filtro) todo = todo.filter(x => x.marca === filtro);
  todo.sort((a, b) => (a.publica || "9999").localeCompare(b.publica || "9999"));
  window.__datos = todo;
  pintar(todo, mes);
  pintarHoy(todo);
  cerrarDia();
  document.getElementById("cuenta").textContent = `${todo.length} piezas`;
  document.getElementById("sello").textContent =
    " · Última lectura: " + new Date().toLocaleString("es-CO");
}

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function pintarHoy(datos) {
  const d = new Date();
  const hoy = d.toISOString().slice(0, 10);
  document.getElementById("hoy-fecha").textContent =
    `${DIAS[d.getDay()]} ${d.getDate()} de ${MES_NOMBRE[hoy.slice(5,7)]}`;
  const suyas = datos.filter(x => x.publica === hoy);
  const caja = document.getElementById("hoy-lista");
  if (!suyas.length) {
    caja.innerHTML = '<span class="nada-hoy">Nada publica hoy.</span>';
    return;
  }
  caja.innerHTML = suyas.map(x => `
    <div class="tarea-hoy">
      <span class="marca m-${x.marca}">${x.marca}</span>
      <span class="t-nom">${x.nombre}</span>
      <span class="t-meta">${x.codigo}${x.formato ? " · " + x.formato : ""}
        ${x.estado ? " · " + x.estado : ""}</span>
    </div>`).join("");
}

function pintar(datos, mes) {
  const caja = document.getElementById("tabla");
  const [a, m] = mes.split("-").map(Number);
  const hoy = new Date().toISOString().slice(0, 10);

  // el calendario arranca en lunes
  const primero = new Date(a, m - 1, 1);
  const arranque = new Date(primero);
  arranque.setDate(1 - ((primero.getDay() + 6) % 7));

  // las piezas, agrupadas por dia de publicacion
  const porDia = {};
  for (const x of datos) {
    if (!x.publica) continue;
    (porDia[x.publica] = porDia[x.publica] || []).push(x);
  }

  const total = datos.filter(x => x.publica && x.publica.slice(0,7) === mes).length;
  let h = `<h2 class="mes-titulo">${MES_NOMBRE[String(m).padStart(2,"0")]} <span>${a}</span></h2>`;
  h += `<div class="mes-sub">${total} piezas programadas</div>`;
  h += '<div class="grilla">';
  for (const d of ["lun","mar","mié","jue","vie","sáb","dom"]) {
    h += `<div class="dia-nom">${d}</div>`;
  }
  const cur = new Date(arranque);
  for (let i = 0; i < 42; i++) {
    const iso = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`;
    const fuera = cur.getMonth() !== m - 1;
    const clases = ["celda"];
    if (fuera) clases.push("fuera");
    else if (cur.getDay() === 0 || cur.getDay() === 6) clases.push("finde");
    if (iso === hoy) clases.push("hoy");
    h += `<div class="${clases.join(" ")}" data-dia="${iso}"><div class="num">${cur.getDate()}</div>`;
    for (const x of (porDia[iso] || [])) {
      h += `<span class="pieza p-${x.marca}" title="${x.nombre.replace(/"/g,"&quot;")}">
              <b>${x.nombre.slice(0, 38)}</b><i>${x.codigo}</i></span>`;
    }
    h += "</div>";
    cur.setDate(cur.getDate() + 1);
    if (i >= 34 && cur.getMonth() !== m - 1) break;   // no dibujar semanas vacias al final
  }
  h += "</div>";
  h += `<div class="leyenda">
    <span class="punto"><i style="background:var(--luvania)"></i> Luvania</span>
    <span class="punto"><i style="background:var(--cifes)"></i> CIFES</span>
    <span class="punto"><i style="background:var(--escuela)"></i> Escuela</span>
    <span style="margin-left:auto">ubicadas por fecha de publicación</span></div>`;
  caja.innerHTML = h;
  caja.querySelectorAll(".celda:not(.fuera)").forEach(c => {
    c.onclick = () => abrirDia(c.dataset.dia, c);
  });
}

const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];

function cerrarDia() {
  document.getElementById("dia-panel").hidden = true;
  document.querySelectorAll(".celda.elegida").forEach(c => c.classList.remove("elegida"));
}

function abrirDia(iso, celda) {
  document.querySelectorAll(".celda.elegida").forEach(c => c.classList.remove("elegida"));
  celda.classList.add("elegida");
  const [a, m, d] = iso.split("-").map(Number);
  const fecha = new Date(a, m - 1, d);
  document.getElementById("dia-titulo").textContent =
    `${DIAS[fecha.getDay()]} ${d} de ${MESES_L[m-1]}`;
  const piezas = (window.__datos || []).filter(x => x.publica === iso);
  const cuerpo = document.getElementById("dia-cuerpo");
  if (!piezas.length) {
    cuerpo.innerHTML = '<span class="nada-hoy">No hay piezas programadas este día.</span>';
  } else {
    cuerpo.innerHTML = piezas.map(x => `
      <div class="det-pieza">
        <span class="marca m-${x.marca}">${x.marca}</span>
        <span class="d-nom">${x.nombre}</span>
        ${x.detalle ? `<div class="d-desc">${x.detalle}</div>` : ""}
        <div class="det-fila"><b>Código</b> · ${x.codigo || "—"}</div>
        <div class="det-fila"><b>Formato</b> · ${x.red || "—"}${x.formato ? " · " + x.formato : ""}</div>
        ${x.tipo ? `<div class="det-fila"><b>Tipo</b> · ${x.tipo}</div>` : ""}
        <div class="det-fila"><b>Estado</b> · ${x.estado || "—"}</div>
        ${x.limite ? `<div class="det-fila"><b>Fecha límite</b> · ${x.limite}</div>` : ""}
      </div>`).join("");
  }
  document.getElementById("dia-panel").hidden = false;
}

const sel = document.getElementById("mes");
for (const k of Object.keys(HOJAS)) {
  const [a, m] = k.split("-");
  sel.insertAdjacentHTML("beforeend",
    `<option value="${k}">${MES_NOMBRE[m]} ${a}</option>`);
}
const actual = new Date().toISOString().slice(0, 7);
sel.value = HOJAS[actual] ? actual : Object.keys(HOJAS)[0];
sel.onchange = cargar;
document.getElementById("marca").onchange = cargar;
document.getElementById("recargar").onclick = cargar;
document.getElementById("cerrar-dia").onclick = cerrarDia;
cargar();
</script>
</body>
</html>
