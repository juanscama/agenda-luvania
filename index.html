<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calendario SMM · Luvania y CIFES</title>
<style>
  :root {
    --tinta: #2b2320;
    --suave: #8a7a70;
    --linea: #d8cabf;
    --borde: #2b2320;
    --coral: #c96f4a;
    --crema: #fbf6f0;
    --fondo: #f2ece4;
    --papel: #ffffff;
    --luvania: #c96f4a;
    --cifes: #4a6fc9;
    --escuela: #7a9e5c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Times New Roman", Times, serif;
    background: var(--fondo); color: var(--tinta);
    margin: 0; padding: 26px 22px 60px;
    font-size: 15px; line-height: 1.5;
  }
  header { margin-bottom: 22px; }
  h1 { font-size: 30px; font-weight: normal; margin: 0 0 4px; letter-spacing: -.5px; }
  .sub { color: var(--suave); font-style: italic; font-size: 14px; }
  .columnas { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }

  aside { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .panel { border: 2px solid var(--borde); background: var(--papel); }
  .panel h2 {
    margin: 0; padding: 10px 14px; font-size: 13px; font-weight: normal;
    text-transform: uppercase; letter-spacing: .8px;
    border-bottom: 2px solid var(--borde); background: var(--crema);
  }
  .panel .cuerpo { padding: 12px 14px; }
  .controles { display: flex; flex-direction: column; gap: 9px; }
  .controles label { font-size: 12px; color: var(--suave); display: block; margin-bottom: 3px; }
  .controles select, .controles button { width: 100%; }

  /* lo de hoy: es lo primero que se mira */
  .hoy-panel { border-color: var(--coral); border-width: 3px; }
  .hoy-panel h2 { background: var(--coral); color: #fff; border-bottom-color: var(--coral); }
  .hoy-fecha { font-size: 13px; color: var(--suave); margin-bottom: 10px; font-style: italic; }
  .tarea-hoy {
    padding: 9px 0; border-bottom: 1.5px solid var(--linea);
  }
  .tarea-hoy:last-child { border-bottom: none; padding-bottom: 0; }
  .tarea-hoy .t-nom { font-weight: bold; display: block; font-size: 14px; }
  .tarea-hoy .t-meta { font-size: 12px; color: var(--suave); }
  .nada-hoy { color: var(--suave); font-style: italic; font-size: 14px; }
  .cuenta { font-size: 12px; color: var(--suave); }

  @media (max-width: 900px) {
    .columnas { grid-template-columns: 1fr; }
    aside { position: static; }
  }
  select, button {
    font-family: inherit; font-size: 14px; padding: 5px 10px;
    border: 1.5px solid var(--borde); background: #fff; color: var(--tinta);
    cursor: pointer;
  }
  button:hover { background: var(--crema); }
  .cuenta { margin-left: auto; font-size: 13px; color: var(--suave); }

  table {
    width: 100%; border-collapse: collapse;
    background: var(--papel);
    border: 2px solid var(--borde);
  }
  caption {
    text-align: left; font-size: 20px; padding: 14px 12px 10px;
    background: var(--papel); border: 2px solid var(--borde);
    border-bottom: none; margin-top: 22px;
  }
  th {
    text-align: left; font-weight: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: .7px; color: var(--suave);
    padding: 9px 8px; border-bottom: 2.5px solid var(--borde);
    background: var(--crema);
  }
  td { padding: 9px 8px; border-bottom: 1.5px solid var(--linea); vertical-align: top; }
  tr:hover td { background: #fdf3e9; }
  .cod { font-size: 12px; color: var(--suave); white-space: nowrap; }
  .nom { font-weight: bold; }
  .det { font-size: 13px; color: var(--suave); display: block; margin-top: 2px; }
  .fecha { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hoy { font-weight: bold; color: var(--coral); }
  .marca {
    display: inline-block; padding: 1px 7px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .5px; border: 1.5px solid;
  }
  .m-Luvania { color: var(--luvania); border-color: var(--luvania); }
  .m-CIFES { color: var(--cifes); border-color: var(--cifes); }
  .m-Escuela { color: var(--escuela); border-color: var(--escuela); }
  .estado { font-size: 12px; white-space: nowrap; }
  .cargando, .vacio { padding: 40px 0; color: var(--suave); font-style: italic; }
  footer {
    margin-top: 40px; padding-top: 14px; border-top: 1.5px solid var(--linea);
    font-size: 12px; color: var(--suave);
  }
  @media (max-width: 700px) {
    body { padding: 16px 12px 40px; font-size: 14px; }
    .col-det, .col-est { display: none; }
  }
  /* la fila de hoy tambien se marca dentro de la tabla */
  tr.fila-hoy td { background: #fdf0e6; border-bottom-color: var(--coral); }
  tr.fila-hoy .nom { color: var(--coral); }
</style>
</head>
<body>

<header>
  <h1>Calendario SMM</h1>
  <div class="sub">Luvania · CIFES Centro Estético · CIFES Escuela</div>
</header>

<div class="columnas">
  <main id="tabla"><p class="cargando">Leyendo el SMM…</p></main>

  <aside>
    <section class="panel hoy-panel">
      <h2>Hoy</h2>
      <div class="cuerpo">
        <div class="hoy-fecha" id="hoy-fecha"></div>
        <div id="hoy-lista"><span class="nada-hoy">Cargando…</span></div>
      </div>
    </section>

    <section class="panel">
      <h2>Filtros</h2>
      <div class="cuerpo controles">
        <div>
          <label for="mes">Mes</label>
          <select id="mes"></select>
        </div>
        <div>
          <label for="marca">Marca</label>
          <select id="marca">
            <option value="">Todas</option>
            <option>Luvania</option>
            <option>CIFES</option>
            <option>Escuela</option>
          </select>
        </div>
        <button id="recargar">Actualizar</button>
        <span class="cuenta" id="cuenta"></span>
      </div>
    </section>
  </aside>
</div>

<footer>
  Se lee directo de las hojas SMM en Drive: lo que se escribe allá aparece aquí al
  actualizar. Sin copias intermedias.
  <span id="sello"></span>
</footer>

<script>
// Cada mes es una hoja distinta en Drive. Se agregan nuevos meses aqui.
const HOJAS = {
  "2026-09": "1yiDQ0QRSdYWipYnBf5eJsJNsVSPq01AmLhtIde1e0uw",
  "2026-10": "1K7HHBgnD1aQJ2neGa3xXJgTVAN4TEUO0BQ_eD56MP8I",
  "2026-11": "1NlZOIWBErAb73h8eJ4YrTmMQHlfoSrzK4MtlbdpENu0",
  "2026-12": "18tjIL4ohe8JjQKUG3pHXEILwTXIxob6dsCCZ782L3Tc"
};
const PESTANAS = [
  ["Luvania", "Seguimiento Luvania"],
  ["CIFES", "Seguimiento CIFES Centro estético"],
  ["Escuela", "Seguimiento CIFES Escuela"]
];
const MES_NOMBRE = {
  "01":"enero","02":"febrero","03":"marzo","04":"abril","05":"mayo","06":"junio",
  "07":"julio","08":"agosto","09":"septiembre","10":"octubre","11":"noviembre","12":"diciembre"
};

// El CSV de Google trae comillas y saltos de linea dentro de las celdas.
function partirCSV(texto) {
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"' && texto[i+1] === '"') { celda += '"'; i++; }
      else if (c === '"') comillas = false;
      else celda += c;
    } else if (c === '"') comillas = true;
    else if (c === ",") { fila.push(celda); celda = ""; }
    else if (c === "\n") { fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}

// Las fechas vienen como 4/9/2026, a veces con hora
function aISO(s) {
  if (!s) return "";
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}

async function traerPestana(id, pestana, marca) {
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(pestana)}&_=${Date.now()}`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const filas = partirCSV(await r.text());
  if (!filas.length) return [];
  const cab = filas[0].map(c => c.trim());
  const col = n => cab.findIndex(c => c.toLowerCase() === n.toLowerCase());
  const iCod = col("ID contenido"), iNom = col("Nombre contenido");
  const iRed = col("RRSS"), iFor = col("Formato"), iDet = col("Detalles");
  const iPub = col("Fecha de publicación"), iLim = col("Fecha límite");
  const iEst = col("Estado producción"), iTipo = col("Tipo contenido");
  return filas.slice(1).map(f => ({
    marca,
    codigo: (f[iCod] || "").trim(),
    nombre: (f[iNom] || "").trim(),
    red: (f[iRed] || "").trim(),
    formato: (f[iFor] || "").trim(),
    detalle: (f[iDet] || "").trim(),
    tipo: (f[iTipo] || "").trim(),
    estado: (f[iEst] || "").trim(),
    publica: aISO(f[iPub]),
    limite: aISO(f[iLim])
  })).filter(x => x.nombre);
}

async function cargar() {
  const mes = document.getElementById("mes").value;
  const filtro = document.getElementById("marca").value;
  const caja = document.getElementById("tabla");
  caja.innerHTML = '<p class="cargando">Leyendo el SMM…</p>';
  const id = HOJAS[mes];
  let todo = [];
  try {
    const partes = await Promise.all(
      PESTANAS.map(([m, p]) => traerPestana(id, p, m).catch(() => []))
    );
    todo = partes.flat();
  } catch (e) {
    caja.innerHTML = '<p class="vacio">No se pudo leer la hoja. Revisa que siga compartida.</p>';
    return;
  }
  if (filtro) todo = todo.filter(x => x.marca === filtro);
  todo.sort((a, b) => (a.publica || "9999").localeCompare(b.publica || "9999"));
  pintar(todo, mes);
  pintarHoy(todo);
  document.getElementById("cuenta").textContent = `${todo.length} piezas`;
  document.getElementById("sello").textContent =
    " · Última lectura: " + new Date().toLocaleString("es-CO");
}

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function pintarHoy(datos) {
  const d = new Date();
  const hoy = d.toISOString().slice(0, 10);
  document.getElementById("hoy-fecha").textContent =
    `${DIAS[d.getDay()]} ${d.getDate()} de ${MES_NOMBRE[hoy.slice(5,7)]}`;
  const suyas = datos.filter(x => x.publica === hoy);
  const caja = document.getElementById("hoy-lista");
  if (!suyas.length) {
    caja.innerHTML = '<span class="nada-hoy">Nada publica hoy.</span>';
    return;
  }
  caja.innerHTML = suyas.map(x => `
    <div class="tarea-hoy">
      <span class="marca m-${x.marca}">${x.marca}</span>
      <span class="t-nom">${x.nombre}</span>
      <span class="t-meta">${x.codigo}${x.formato ? " · " + x.formato : ""}
        ${x.estado ? " · " + x.estado : ""}</span>
    </div>`).join("");
}

function pintar(datos, mes) {
  const caja = document.getElementById("tabla");
  if (!datos.length) { caja.innerHTML = '<p class="vacio">Sin piezas en este mes.</p>'; return; }
  const hoy = new Date().toISOString().slice(0, 10);
  const [a, m] = mes.split("-");
  let h = `<table><caption>${MES_NOMBRE[m]} de ${a}</caption><thead><tr>
    <th>Marca</th><th>Código</th><th>Contenido</th>
    <th class="col-det">Formato</th><th>Publica</th><th>Límite</th>
    <th class="col-est">Estado</th></tr></thead><tbody>`;
  for (const x of datos) {
    const esHoy = x.publica === hoy ? " hoy" : "";
    h += `<tr class="${x.publica === hoy ? 'fila-hoy' : ''}">
      <td><span class="marca m-${x.marca}">${x.marca}</span></td>
      <td class="cod">${x.codigo}</td>
      <td><span class="nom">${x.nombre}</span>
          ${x.detalle ? `<span class="det">${x.detalle.slice(0,120)}</span>` : ""}</td>
      <td class="col-det">${x.red}${x.formato ? " · " + x.formato : ""}</td>
      <td class="fecha${esHoy}">${x.publica || "—"}</td>
      <td class="fecha">${x.limite || "—"}</td>
      <td class="col-est estado">${x.estado || "—"}</td>
    </tr>`;
  }
  caja.innerHTML = h + "</tbody></table>";
}

const sel = document.getElementById("mes");
for (const k of Object.keys(HOJAS)) {
  const [a, m] = k.split("-");
  sel.insertAdjacentHTML("beforeend",
    `<option value="${k}">${MES_NOMBRE[m]} ${a}</option>`);
}
const actual = new Date().toISOString().slice(0, 7);
sel.value = HOJAS[actual] ? actual : Object.keys(HOJAS)[0];
sel.onchange = cargar;
document.getElementById("marca").onchange = cargar;
document.getElementById("recargar").onclick = cargar;
cargar();
</script>
</body>
</html>
